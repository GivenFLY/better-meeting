name: Release

# Publishes to PyPI when a version tag is pushed. Authentication uses PyPI
# Trusted Publishing (OIDC), so no API token is stored in the repository.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches the package version
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - run: uv build
      - name: Wheel ships the agent guide
        run: unzip -l dist/*.whl | grep -q "better_meeting/AGENTS.md"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/better-meeting/
    permissions:
      id-token: write # required for PyPI Trusted Publishing
    steps:
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: uv publish
