[project]
name = "better-meeting"
version = "0.3.0"
description = "Extract everything from a meeting recording — timestamped transcript, on-screen text, key screenshots — into a self-contained per-video folder your LLM can use as full context to talk to the video. No LLM inside: pure extractor."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Oleksii Moshura", email = "alexey.givenfly.moshura@gmail.com" }]
keywords = ["meeting", "transcription", "whisper", "ocr", "screenshots", "ffmpeg", "llm"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "mlx-whisper>=0.4.3 ; sys_platform == 'darwin'",
    "pillow>=12.3.0",
    "pyobjc-framework-vision>=12.2.1 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Non-macOS ASR backend. Enable with: pip install "better-meeting[faster]"
faster = ["faster-whisper>=1.0.0"]
parakeet = [
    "parakeet-mlx>=0.5.2 ; sys_platform == 'darwin'",
]

[project.scripts]
bm = "better_meeting.cli:main"

[project.urls]
Homepage = "https://github.com/GivenFLY/better-meeting"
Repository = "https://github.com/GivenFLY/better-meeting"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["better_meeting"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "better_meeting/AGENTS.md"
