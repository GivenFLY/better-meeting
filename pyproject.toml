[project]
name = "better-meeting"
version = "0.4.0"
description = "Turn a meeting recording into LLM-ready context: timestamped transcript, on-screen text and key screenshots."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Oleksii Moshura", email = "alexey.givenfly.moshura@gmail.com" }]
keywords = ["meeting", "transcription", "whisper", "parakeet", "ocr", "screenshots", "ffmpeg", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "mlx-whisper>=0.4.3 ; sys_platform == 'darwin'",
    "pillow>=12.3.0",
    "pyobjc-framework-vision>=12.2.1 ; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Whisper on Linux/Windows (CTranslate2).
faster = ["faster-whisper>=1.0.0"]
# NVIDIA Parakeet TDT: one multilingual pass (macOS, MLX).
parakeet = ["parakeet-mlx>=0.5.2 ; sys_platform == 'darwin'"]

[project.scripts]
bm = "better_meeting.cli:main"

[project.urls]
Homepage = "https://github.com/GivenFLY/better-meeting"
Repository = "https://github.com/GivenFLY/better-meeting"
Issues = "https://github.com/GivenFLY/better-meeting/issues"
Changelog = "https://github.com/GivenFLY/better-meeting/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["better_meeting"]

[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "better_meeting/AGENTS.md"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]  # code snippets in docs are illustrative, not formatted

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode: Cyrillic strings are intentional
    "RUF002",
    "RUF003",
    "SIM905",  # split() word lists read better than long list literals
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["ffmpeg: needs ffmpeg/ffprobe on PATH (skipped otherwise)"]
